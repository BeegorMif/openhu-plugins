# Plugin unit tests, Python syntax and QML syntax on Debian trixie (the OpenHU target system).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
              python3 python3-websockets qtdeclarative5-dev-tools git ca-certificates >/dev/null

      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          for tests in plugins/*/tests; do
            echo "::group::$(dirname "$tests")"
            (cd "$(dirname "$tests")" && python3 -m unittest discover -s tests -v)
            echo "::endgroup::"
          done

      - name: Python syntax
        run: python3 -m py_compile common/*.py plugins/*/bin/*.py tools/openhu-repo-index

      - name: QML syntax
        run: find plugins -name '*.qml' -print0 | xargs -0 /usr/lib/qt5/bin/qmllint
